<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Botanica Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#192437">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<main class="auth">
  <div class="auth__bg"></div>

  <div class="auth__card">
    <img class="brand__logo brand__logo--stacked" src="assets/logo-full.png"
         width="548" height="214" alt="Botanica by Collective Space">

    <section class="auth__step is-on">
      <p class="eyebrow">Salon admin</p>
      <h1 style="font-size:clamp(1.7rem,4vw,2.2rem);margin-bottom:.35em">Sign in</h1>
      <p class="dim" style="font-size:.92rem">
        Enter the salon passphrase to manage the stylist roster.
      </p>

      <form id="form-login" novalidate>
        <div class="field" style="margin-top:18px">
          <label for="passphrase">Passphrase</label>
          <input id="passphrase" name="passphrase" type="password"
                 autocomplete="current-password" required autofocus
                 placeholder="••••••••••••••••">
        </div>

        <label style="display:flex;align-items:center;gap:9px;margin-top:12px;
                      font-size:.85rem;color:var(--muted);cursor:pointer">
          <input type="checkbox" id="show" style="width:auto"> Show passphrase
        </label>

        <button class="btn btn--clay" type="submit" style="width:100%;margin-top:16px">
          <span class="lbl">Sign in</span> <span class="arw">&#8594;</span>
        </button>
      </form>

      <div class="msg msg--err" id="err">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.1"/></svg>
        <span></span>
      </div>
      <div class="msg msg--ok" id="ok">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span>Signed in. Taking you to the dashboard&hellip;</span>
      </div>
    </section>

    <p class="form__note" style="margin:26px 0 0;text-align:center">
      <a class="tlink" href="index.html">&#8592; Back to the website</a>
    </p>
  </div>
</main>

<script src="assets/auth.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var form = $('#form-login');
  var btn  = form.querySelector('button[type=submit]');
  var label = btn.querySelector('.lbl').textContent;

  function say(text) {
    $('#err').querySelector('span').textContent = text;
    $('#err').classList.add('is-on');
  }
  function clear() {
    $('#err').classList.remove('is-on');
    $('#ok').classList.remove('is-on');
  }
  function busy(on) {
    btn.disabled = on;
    btn.querySelector('.lbl').textContent = on ? 'Checking…' : label;
  }

  // already signed in? go straight through
  if (BotanicaAuth.token()) location.replace('admin.html');

  $('#show').addEventListener('change', function () {
    $('#passphrase').type = this.checked ? 'text' : 'password';
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clear();

    var value = $('#passphrase').value;
    if (!value) return say('Enter your passphrase.');

    busy(true);
    BotanicaAuth.signIn(value)
      .then(function () {
        busy(false);
        $('#ok').classList.add('is-on');
        setTimeout(function () { location.href = 'admin.html'; }, 500);
      })
      .catch(function (err) {
        busy(false);
        $('#passphrase').value = '';
        $('#passphrase').focus();
        say(err.message);
      });
  });
})();
</script>
</body>
</html>

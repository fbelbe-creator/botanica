<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Botanica Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#192437">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<main class="auth">
  <div class="auth__bg"></div>

  <div class="auth__card">
    <img class="brand__logo brand__logo--stacked" src="assets/logo-full.png"
         width="548" height="214" alt="Botanica by Collective Space">

    <!-- ------------------------------------------------ Step 1: email -->
    <section class="auth__step is-on" id="step-email">
      <p class="eyebrow">Salon admin</p>
      <h1 style="font-size:clamp(1.7rem,4vw,2.2rem);margin-bottom:.35em">Sign in</h1>
      <p class="dim" style="font-size:.92rem">
        Enter your email and we'll send a six-digit code. No password to remember.
      </p>

      <form id="form-email" novalidate>
        <div class="field" style="margin-top:18px">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 inputmode="email" required placeholder="you@example.com" autofocus>
        </div>
        <button class="btn btn--clay" type="submit" style="width:100%;margin-top:16px">
          <span class="lbl">Send me a code</span> <span class="arw">&#8594;</span>
        </button>
      </form>

      <div class="msg msg--err" id="err-email">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.1"/></svg>
        <span></span>
      </div>
    </section>

    <!-- ------------------------------------------------- Step 2: code -->
    <section class="auth__step" id="step-code">
      <p class="eyebrow">Check your inbox</p>
      <h1 style="font-size:clamp(1.7rem,4vw,2.2rem);margin-bottom:.35em">Enter your code</h1>
      <p class="dim" style="font-size:.92rem">
        We sent a six-digit code to <strong id="sent-to" style="color:var(--ink)"></strong>.
        It expires in 10 minutes.
      </p>

      <form id="form-code" novalidate>
        <div class="field" style="margin-top:18px">
          <label for="code">Six-digit code</label>
          <input id="code" name="code" class="code-input" type="text" inputmode="numeric"
                 pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"
                 required placeholder="000000">
        </div>
        <button class="btn btn--clay" type="submit" style="width:100%;margin-top:16px">
          <span class="lbl">Sign in</span> <span class="arw">&#8594;</span>
        </button>
      </form>

      <div class="msg msg--err" id="err-code">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.1"/></svg>
        <span></span>
      </div>
      <div class="msg msg--ok" id="ok-code">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span>Signed in. Taking you to the dashboard&hellip;</span>
      </div>

      <div style="display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap">
        <button class="tlink" type="button" id="back">&#8592; Use a different email</button>
        <button class="tlink" type="button" id="resend">Resend code</button>
      </div>
    </section>

    <p class="form__note" style="margin:26px 0 0;text-align:center">
      <a class="tlink" href="index.html">&#8592; Back to the website</a>
    </p>
  </div>
</main>

<script src="assets/auth.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var stepEmail = $('#step-email'), stepCode = $('#step-code');
  var email = '';

  function show(el) {
    [stepEmail, stepCode].forEach(function (s) { s.classList.remove('is-on'); });
    el.classList.add('is-on');
    var f = el.querySelector('input'); if (f) setTimeout(function () { f.focus(); }, 60);
  }
  function say(sel, text, kind) {
    var box = $(sel);
    box.querySelector('span').textContent = text;
    box.className = 'msg msg--' + (kind || 'err') + ' is-on';
  }
  function clearMsgs() {
    ['#err-email', '#err-code', '#ok-code'].forEach(function (s) { $(s).classList.remove('is-on'); });
  }
  function busy(form, on, label) {
    var btn = form.querySelector('button[type=submit]');
    btn.disabled = on;
    btn.querySelector('.lbl').textContent = on ? (label || 'Working…') : btn.dataset.label;
  }

  // remember the original button labels
  document.querySelectorAll('button[type=submit]').forEach(function (b) {
    b.dataset.label = b.querySelector('.lbl').textContent;
  });

  // already signed in? go straight through
  if (BotanicaAuth.token()) location.replace('admin.html');

  $('#form-email').addEventListener('submit', function (e) {
    e.preventDefault(); clearMsgs();
    var v = $('#email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) {
      return say('#err-email', 'That email address doesn\'t look right.');
    }
    email = v;
    busy(this, true, 'Sending…');
    var form = this;
    BotanicaAuth.requestCode(email)
      .then(function (res) {
        busy(form, false);
        $('#sent-to').textContent = res.sentTo || 'the salon owner';
        show(stepCode);
        if (res.devCode) say('#err-code', 'Preview mode — your code is ' + res.devCode, 'info');
      })
      .catch(function (err) { busy(form, false); say('#err-email', err.message); });
  });

  $('#form-code').addEventListener('submit', function (e) {
    e.preventDefault(); clearMsgs();
    var code = $('#code').value.replace(/\D/g, '');
    if (code.length !== 6) return say('#err-code', 'Enter the six digits from the email.');
    busy(this, true, 'Checking…');
    var form = this;
    BotanicaAuth.verifyCode(email, code)
      .then(function () {
        busy(form, false);
        $('#ok-code').classList.add('is-on');
        setTimeout(function () { location.href = 'admin.html'; }, 700);
      })
      .catch(function (err) { busy(form, false); say('#err-code', err.message); });
  });

  $('#back').addEventListener('click', function () { clearMsgs(); show(stepEmail); });
  $('#resend').addEventListener('click', function () {
    clearMsgs();
    BotanicaAuth.requestCode(email)
      .then(function (res) {
        say('#err-code', res.devCode ? 'Preview mode — your code is ' + res.devCode : 'A new code is on its way.', 'info');
      })
      .catch(function (err) { say('#err-code', err.message); });
  });

  // auto-submit once six digits are in
  $('#code').addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 6);
    if (this.value.length === 6) $('#form-code').requestSubmit();
  });
})();
</script>
</body>
</html>
